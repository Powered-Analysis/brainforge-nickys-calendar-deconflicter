[project]
name = "dispatcher"
version = "0.1.0"
description = "Detects conflicts across Google Calendars and hands each one to a Sentience agent."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "google-api-python-client>=2.202.0",
    "google-auth>=2.62.2",
    "google-auth-httplib2>=0.4.4",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "turso-serverless",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispatcher"]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["UP", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
